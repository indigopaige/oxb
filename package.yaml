spec-version: 0.36.0

default-extensions:
        - GeneralizedNewtypeDeriving
        - MultiParamTypeClasses
        - ExtendedDefaultRules
        - ImportQualifiedPost
        - OverloadedStrings
        - FlexibleInstances
        - FlexibleContexts
        - TypeApplications
        - PatternSynonyms
        - ConstraintKinds
        - TemplateHaskell
        - NamedFieldPuns
        - TypeOperators
        - DeriveGeneric
        - LambdaCase
        - RankNTypes
        - DataKinds
        - Arrows
        - GADTs

dependencies:
        - base >= 4.15 && < 5
        - containers
        - org-parser
        - directory
        - effectful
        - lucid
        - text
        - lens

executables:
        oxb:
                main: app/Main.hs
                dependencies:
                        - oxb

library:
        source-dirs: src